server {
    listen 80;
    server_name _;

    # 上传体积上限（后端 upload/image 已放宽至 50MB，此处留 60MB 余量防 413）
    client_max_body_size 60m;

    # 静态资源压缩（web 打开慢根因修复：此前未开 gzip，JS/CSS 裸传）
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/javascript application/xml image/svg+xml application/wasm font/ttf font/otf application/vnd.ms-fontobject;
    # 优先命中构建产物里的 .gz 预压缩文件（viteCompression 生成），无 .gz 时回退实时 gzip
    gzip_static on;

    # 前端静态资源（base=/web，构建产物在 /usr/share/nginx/html/web）
    location /web {
        root /usr/share/nginx/html;
        index index.html;
        # Hash 路由无需 SPA fallback；静态资源直接命中，缺失时回落首页
        try_files $uri $uri/ /web/index.html;
    }

    # 医生端 H5（vite base=/app，静态产物挂载于 /usr/share/nginx/html/app；hash 路由无需 history fallback）
    location /app {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /app/index.html;
    }

    # 浏览器对 host 根路径的 favicon 兜底请求（favicon 缓存基于 host，与前端 base 无关）
    location = /favicon.ico {
        return 301 /web/favicon.ico;
    }

    # 后端 API（/api/v1/* 全部反代到 backend:8001）
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx 作为 TLS 终结端：恒传 https，否则 PROD 的 HTTPSRedirect 中间件会把 http 请求 301 到未开放的 443
        proxy_set_header X-Forwarded-Proto https;
    }

    # 富文本等文件上传（/common/file/upload 等）
    location /common/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 上传文件（医生照片 / 会议PPTX / 认证知识库 / 心电图图），由后端 /static 提供
    location /static/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
    }

    # WebSocket（人工客服等）：必须带 Upgrade/Connection 头
    location /api/v1/system/chat/ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 恒传 https：避免后端 HTTPSRedirect 中间件把 ws http 握手 301 到未开放的 443
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }

    # WebSocket（AI 对话，App/Web 共用 /ai/chat/ws）：必须带 Upgrade/Connection 头
    location /api/v1/ai/chat/ws {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # 恒传 https：避免后端 HTTPSRedirect 中间件把 ws http 握手 301 到未开放的 443
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
