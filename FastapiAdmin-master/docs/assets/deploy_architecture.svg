<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" font-family="'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif">
  <!-- 背景 -->
  <rect x="0" y="0" width="680" height="540" fill="#ffffff"/>

  <!-- 标题 -->
  <text x="340" y="28" text-anchor="middle" font-size="18" font-weight="bold" fill="#1f2937">部署架构总览（4 容器 · 腾讯云轻量 2C2G · Ubuntu）</text>

  <!-- 浏览器/手机 节点 -->
  <rect x="255" y="48" width="170" height="46" rx="8" fill="#e0f2fe" stroke="#2563eb" stroke-width="1.5"/>
  <text x="340" y="67" text-anchor="middle" font-size="14" font-weight="bold" fill="#1e3a8a">浏览器 / 手机</text>
  <text x="340" y="84" text-anchor="middle" font-size="11" fill="#374151">访问 :80（:8001 可选直连）</text>

  <!-- 箭头：浏览器 -> cpx-web -->
  <path d="M340 94 L340 128" stroke="#2563eb" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <!-- cpx-web nginx 框 -->
  <rect x="120" y="130" width="440" height="118" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.8"/>
  <text x="340" y="152" text-anchor="middle" font-size="15" font-weight="bold" fill="#14532d">cpx-web · nginx:alpine · :80</text>
  <line x1="138" y1="162" x2="542" y2="162" stroke="#16a34a" stroke-width="0.6" opacity="0.5"/>

  <text x="150" y="184" font-size="12.5" fill="#374151">• <tspan font-weight="bold" fill="#166534">/web</tspan> 静态资源 → /usr/share/nginx/html/web</text>
  <text x="150" y="206" font-size="12.5" fill="#374151">• <tspan font-weight="bold" fill="#166534">/api /common /static</tspan> → 反代 backend:8001</text>
  <text x="150" y="228" font-size="12.5" fill="#374151">• <tspan font-weight="bold" fill="#166534">/ws</tspan>（Upgrade 头透传）→ backend:8001</text>

  <!-- 箭头：cpx-web -> cpx-backend -->
  <path d="M340 248 L340 300" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="352" y="278" font-size="11" fill="#166534">反代</text>

  <!-- 内部网络标注 -->
  <rect x="120" y="296" width="440" height="222" rx="12" fill="#fffbeb" stroke="#d97706" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.95"/>
  <text x="340" y="316" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#92400e">内部网络 cpx（MySQL / Redis 不映射宿主机端口）</text>

  <!-- cpx-backend 框 -->
  <rect x="255" y="330" width="170" height="64" rx="9" fill="#ede9fe" stroke="#7c3aed" stroke-width="1.8"/>
  <text x="340" y="356" text-anchor="middle" font-size="14" font-weight="bold" fill="#4c1d95">cpx-backend</text>
  <text x="340" y="376" text-anchor="middle" font-size="12" fill="#374151">python:3.12-slim · :8001</text>

  <!-- 箭头：backend -> mysql -->
  <path d="M325 394 L160 426" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrowV)"/>
  <text x="232" y="416" font-size="10.5" fill="#6d28d9">3306 内部</text>

  <!-- 箭头：backend -> redis -->
  <path d="M355 394 L520 426" stroke="#7c3aed" stroke-width="2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrowV)"/>
  <text x="448" y="416" font-size="10.5" fill="#6d28d9">6379 内部</text>

  <!-- cpx-mysql 框 -->
  <rect x="75" y="430" width="160" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="155" y="456" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">cpx-mysql</text>
  <text x="155" y="475" text-anchor="middle" font-size="11.5" fill="#374151">mysql:8.0 · 业务库 cpx</text>
  <text x="155" y="491" text-anchor="middle" font-size="10" fill="#991b1b">仅内部 3306</text>

  <!-- cpx-redis 框 -->
  <rect x="445" y="430" width="160" height="62" rx="9" fill="#fef2f2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="525" y="456" text-anchor="middle" font-size="13.5" font-weight="bold" fill="#7f1d1d">cpx-redis</text>
  <text x="525" y="475" text-anchor="middle" font-size="11.5" fill="#374151">redis:7-alpine · db=1</text>
  <text x="525" y="491" text-anchor="middle" font-size="10" fill="#991b1b">仅内部 6379</text>

  <!-- 说明 -->
  <text x="340" y="524" text-anchor="middle" font-size="11.5" fill="#6b7280">注：外部仅暴露 80（Web）；8001 可选直连。MySQL / Redis 仅走 cpx 内部桥接网络，外部不可直连。</text>

  <!-- 箭头定义 -->
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#2563eb"/>
    </marker>
    <marker id="arrowV" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7c3aed"/>
    </marker>
  </defs>
</svg>
